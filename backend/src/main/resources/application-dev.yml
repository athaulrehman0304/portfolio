# Development profile overrides. Activate with SPRING_PROFILES_ACTIVE=dev.
# Values here are for local development only and must never be used in production.
app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  admin:
    # Credentials for the development-only admin account seeded at startup.
    email: ${APP_ADMIN_EMAIL:admin@athaul.com}
    password: ${APP_ADMIN_PASSWORD:admin12345}
