spring:
  application:
    name: portfolio-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/portfolio}
    username: ${SPRING_DATASOURCE_USERNAME:portfolio}
    password: ${SPRING_DATASOURCE_PASSWORD:portfolio}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: 8080

app:
  security:
    jwt:
      # Base64-encoded HMAC-SHA secret. REQUIRED: the application will not start
      # unless APP_SECURITY_JWT_SECRET is provided. Never commit a real secret.
      secret: ${APP_SECURITY_JWT_SECRET}
      # Token time-to-live in milliseconds (24 hours).
      expiration: ${APP_SECURITY_JWT_EXPIRATION:86400000}
      issuer: portfolio-backend
  cors:
    # Comma-separated list of allowed origins, supplied per environment.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS
    allowed-headers: "*"
    allow-credentials: true
    max-age: 3600
  storage:
    # Absolute or relative directory where uploaded images are stored.
    # Use an absolute, persistent path in production (e.g. a mounted volume).
    location: ${APP_STORAGE_LOCATION:./uploads}
    # Public URL path prefix under which uploaded files are served.
    public-url-prefix: ${APP_STORAGE_PUBLIC_URL_PREFIX:/uploads}
    # Maximum accepted file size in bytes (5 MB).
    max-file-size-bytes: ${APP_STORAGE_MAX_FILE_SIZE_BYTES:5242880}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
